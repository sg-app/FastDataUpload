# =============================================================================
# FastDataUpload - Web container (Nginx)
# -----------------------------------------------------------------------------
# Serves the built React SPA and proxies the /api/* requests to the backend.
# Only static application files are exposed; there is no directory listing and
# no access to any other resources.
# =============================================================================

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads may be large (high resolution photos). The effective limit is
    # enforced by the backend (MAX_FILE_SIZE_MB); Nginx must not block earlier.
    client_max_body_size 0;

    # Disable directory listing.
    autoindex off;

    # Basic hardening headers.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;

    # -------------------------------------------------------------------------
    # API proxy -> backend container
    # -------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Stream large uploads without buffering them to disk first.
        proxy_request_buffering off;
        client_max_body_size 0;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # -------------------------------------------------------------------------
    # Static assets - hashed by Vite, safe to cache aggressively
    # -------------------------------------------------------------------------
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The favicon and SVG logos always revalidate.
    location ~* \.(svg|png|ico)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # -------------------------------------------------------------------------
    # SPA fallback - any unknown path serves the app shell so client side
    # routing (e.g. /upload/<token>) works on a full page load.
    # The backend validates the token; unknown tokens render an error screen.
    # -------------------------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }
}
